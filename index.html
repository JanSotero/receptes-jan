<!DOCTYPE html>
<html lang="ca">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  
  <!-- VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <!-- MODE APP - OCULTA LA BARRA DEL NAVEGADOR -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Receptes Jan">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f0ede0">
  <meta name="apple-mobile-web-app-orientations" content="portrait">
  
  <!-- ICONA -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c98521'/><text x='50' y='72' font-size='60' text-anchor='middle' font-family='Arial'>🍳</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c98521'/><text x='50' y='72' font-size='60' text-anchor='middle' font-family='Arial'>🍳</text></svg>">
  <link rel="manifest" href="./manifest.json">
  <title>Receptes Jan</title>

  <style>
    /* ===================== */
    /* SPLASH SCREEN         */
    /* ===================== */
    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1a1f17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splashScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splashScreen .logo {
      font-size: 80px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    #splashScreen h1 {
      color: #eceade;
      font: 700 28px Georgia, serif;
      margin: 16px 0 0;
    }
    #splashScreen p {
      color: #9aa890;
      font-size: 14px;
      margin: 8px 0 0;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* ===================== */
    /* VARIABLES              */
    /* ===================== */
    :root {
      --bg: #f0ede0;
      --bg2: #e5e0ce;
      --paper: #fbfaf4;
      --paper2: #f4f1e5;
      --ink: #1e231b;
      --muted: #5a6350;
      --olive: #4b5c3b;
      --olive2: #627450;
      --accent: #c98521;
      --accent-soft: #ead09d;
      --line: #d4cfba;
      --white: #ffffff;
      --danger: #a54b35;
      --success: #4b7a4b;
      --shadow: 0 4px 20px rgba(30,35,26,.08);
      --radius: 16px;
      --nav-height: 68px;
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }

    [data-theme="dark"] {
      --bg: #161c13;
      --bg2: #1f261b;
      --paper: #252d20;
      --paper2: #2c3526;
      --ink: #eceade;
      --muted: #9aa890;
      --olive: #7a8f68;
      --olive2: #8fa37d;
      --accent: #d99a3a;
      --accent-soft: #5a4a2a;
      --line: #3d4835;
      --white: #2a3323;
      --shadow: 0 4px 20px rgba(0,0,0,.35);
    }

    /* ===================== */
    /* RESET                 */
    /* ===================== */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      -webkit-overflow-scrolling: touch;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      line-height: 1.5;
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 10px);
      transition: background .3s, color .3s;
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    /* Mode app: sense scrollbar i sense barra */
    @media (display-mode: standalone) {
      ::-webkit-scrollbar { display: none; }
      body { padding-top: env(safe-area-inset-top, 0px); }
    }

    /* ===================== */
    /* BOTONS I ELEMENTS      */
    /* ===================== */
    button, input, textarea, select { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
      background: transparent;
      color: inherit;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    button:active {
      transform: scale(0.96);
      opacity: 0.8;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: 2px;
    }

    /* ===================== */
    /* TOGGLE TEMA            */
    /* ===================== */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--paper);
      border: 1px solid var(--line);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }

    /* ===================== */
    /* WRAPPER                */
    /* ===================== */
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 14px calc(var(--nav-height) + var(--safe-bottom) + 20px);
    }

    /* ===================== */
    /* HEADER                 */
    /* ===================== */
    header {
      padding: 4px 0 12px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 12px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--olive);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 900 clamp(32px, 7vw, 48px)/.95 Georgia, "Times New Roman", serif;
      letter-spacing: -.03em;
    }
    h1 span { color: var(--accent); font-style: italic; }
    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font: italic 14px/1.35 Georgia, "Times New Roman", serif;
    }

    /* ===================== */
    /* CATEGORIES SCROLL      */
    /* ===================== */
    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }

    .category-chip {
      flex: 0 0 auto;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--paper);
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      scroll-snap-align: start;
      transition: all .15s;
    }
    .category-chip.active {
      background: var(--olive);
      border-color: var(--olive);
      color: #fff;
    }

    /* ===================== */
    /* QUICK ACTIONS          */
    /* ===================== */
    .quick-actions {
      display: flex;
      gap: 7px;
      margin: 6px 0 14px;
      flex-wrap: wrap;
    }
    .quick-btn {
      flex: 1;
      min-width: 60px;
      padding: 12px 10px;
      border-radius: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      font-weight: 800;
      font-size: 12px;
      text-align: center;
      transition: all .15s;
    }
    .quick-btn.gold {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .quick-btn .icon { display: block; font-size: 22px; margin-bottom: 2px; }

    /* ===================== */
    /* RESULTS (TARGETES)    */
    /* ===================== */
    .results {
      display: grid;
      gap: 10px;
      margin-top: 4px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 74px;
      transition: transform .12s;
    }
    .card:active { transform: scale(0.98); }

    .card-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 15px;
      background: transparent;
      border: 0;
      text-align: left;
      color: var(--ink);
      min-height: 68px;
    }
    .card-main { flex: 1; min-width: 0; }
    .card-main .category {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .card-main .title {
      font: 700 clamp(18px, 4vw, 22px)/1.1 Georgia, "Times New Roman", serif;
      margin: 0;
    }
    .card-main .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .card-main .meta .tag {
      background: var(--bg2);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .card .chev {
      font-size: 24px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ===================== */
    /* MODAL DETALL RECEPTA  */
    /* ===================== */
    .recipe-modal { align-items: stretch; padding: 0; background: var(--bg); }
    .recipe-modal .modal-box {
      width: 100%;
      max-width: 720px;
      max-height: none;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: var(--paper);
      overflow: auto;
    }
    .recipe-top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(251, 250, 244, .94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    [data-theme="dark"] .recipe-top {
      background: rgba(37, 45, 32, .94);
    }
    .recipe-top .back {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .recipe-top .actions {
      display: flex;
      gap: 6px;
    }
    .recipe-top .actions button {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .recipe-top .actions .edit {
      background: var(--olive);
      border-color: var(--olive);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      padding: 0 16px;
      width: auto;
    }
    .recipe-content { padding: 20px 18px 40px; }
    .recipe-content .cat {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--olive);
    }
    .recipe-content h2 {
      font: 900 clamp(34px, 7vw, 48px)/1.05 Georgia, "Times New Roman", serif;
      margin: 6px 0 10px;
      letter-spacing: -.02em;
    }
    .recipe-content .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    .recipe-content .badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: var(--bg2);
    }
    .recipe-content .badge.accent {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .recipe-content .section { margin-top: 24px; }
    .recipe-content .section h3 {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--olive);
      margin: 0 0 8px;
    }

    .ingredient-list {
      display: grid;
      gap: 4px;
      font-size: 17px;
      line-height: 1.6;
    }
    .ingredient-list .item {
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ingredient-list .item::before {
      content: "•";
      color: var(--accent);
      font-weight: 900;
      font-size: 20px;
    }

    .step-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: step;
    }
    .step-list li {
      counter-increment: step;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg2);
      border-radius: 12px;
      font-size: 17px;
      line-height: 1.5;
      transition: opacity .2s, background .2s;
    }
    .step-list li.done { opacity: .5; background: var(--line); }
    .step-list li .num {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .step-list li .step-check {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      margin-top: 2px;
      transition: all .15s;
      cursor: pointer;
    }
    .step-list li.done .step-check {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .step-list li .step-text { flex: 1; padding-top: 2px; }
    .step-list li.done .step-text { text-decoration: line-through; }

    .recipe-tags {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .recipe-tags span {
      background: var(--bg2);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
    }

    .fav-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-weight: 800;
      font-size: 15px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all .15s;
    }
    .fav-btn.is-fav {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .cook-mode-btn {
      position: fixed;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
      right: 16px;
      z-index: 45;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 24px;
      border: 0;
      box-shadow: 0 4px 20px rgba(201, 133, 33, .35);
    }

    /* ===================== */
    /* MENÚ                   */
    /* ===================== */
    .menu-hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }
    .menu-hero h2 {
      font: 700 24px/1 Georgia, "Times New Roman", serif;
      margin: 0;
    }
    .menu-hero p {
      font-size: 12px;
      color: var(--muted);
      margin: 6px 0 0;
    }
    .menu-controls {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .menu-controls select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
    }
    .menu-controls .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .menu-grid {
      display: grid;
      gap: 8px;
    }
    .menu-day {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }
    .menu-day h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--olive);
      margin: 0 0 6px;
    }
    .menu-slot {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 6px;
      background: var(--paper2);
      min-height: 54px;
    }
    .menu-slot small {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .06em;
    }
    .menu-slot button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0;
      color: var(--ink);
    }
    .menu-slot button strong {
      font: 700 16px/1.2 Georgia, "Times New Roman", serif;
      display: block;
      margin-top: 2px;
    }
    .menu-slot .hint {
      font-size: 10px;
      color: var(--muted);
    }
    .menu-slot .replaced {
      color: var(--accent);
      font-size: 9px;
      font-weight: 700;
    }
    .menu-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .menu-actions .tool {
      flex: 1;
      min-width: 70px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-weight: 800;
      font-size: 12px;
      text-align: center;
    }
    .menu-actions .tool.gold {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ===================== */
    /* NAVEGACIÓ INFERIOR    */
    /* ===================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-around;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--paper);
      border-top: 1px solid var(--line);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, .06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    [data-theme="dark"] .bottom-nav {
      background: rgba(37, 45, 32, .92);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 0;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      border: 0;
      background: transparent;
      transition: color .15s;
      position: relative;
    }
    .nav-item .icon { font-size: 24px; line-height: 1; }
    .nav-item.active { color: var(--accent); }
    .nav-item.active .icon { transform: scale(1.05); }
    .nav-item .badge {
      position: absolute;
      top: 2px;
      right: 50%;
      transform: translateX(calc(50% + 20px));
      background: var(--danger);
      color: #fff;
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 999px;
      min-width: 18px;
      text-align: center;
    }

    /* ===================== */
    /* BOTÓ FLOTANT +        */
    /* ===================== */
    .fab {
      position: fixed;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
      right: 16px;
      z-index: 35;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 30px;
      border: 0;
      box-shadow: 0 4px 20px rgba(201, 133, 33, .3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===================== */
    /* BOTÓ TORNAR A DALT    */
    /* ===================== */
    .back-to-top {
      position: fixed;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 80px);
      right: 16px;
      z-index: 30;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: 0;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(201, 133, 33, .3);
      opacity: 0;
      transition: opacity .3s, transform .15s;
      transform: scale(.8);
      pointer-events: none;
    }
    .back-to-top.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: all;
    }

    /* ===================== */
    /* MODALS                */
    /* ===================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 10px;
      background: rgba(0, 0, 0, .4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .modal.show { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      overflow: auto;
      background: var(--paper);
      border-radius: 20px 20px 8px 8px;
      border: 1px solid var(--line);
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .modal-header h2 {
      font: 700 24px/1 Georgia, "Times New Roman", serif;
      margin: 0;
    }
    .modal-header .close {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form {
      display: grid;
      gap: 10px;
    }
    .form label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      display: block;
      margin-bottom: 3px;
    }
    .form input, .form textarea, .form select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper2);
      color: var(--ink);
      font-size: 15px;
    }
    .form textarea { min-height: 80px; resize: vertical; }

    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .editor-full { grid-column: 1/-1; }

    /* ===================== */
    /* CERCA MODAL            */
    /* ===================== */
    .search-modal .modal-box { max-width: 500px; padding: 20px; }
    .search-modal input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 18px;
      outline: 0;
    }
    .search-modal input:focus { border-color: var(--accent); }
    .search-modal .results {
      margin-top: 14px;
      max-height: 55vh;
      overflow: auto;
    }

    /* ===================== */
    /* UTILITIES              */
    /* ===================== */
    .view { display: none; }
    .view.active { display: block; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      font: 700 20px/1.2 Georgia, "Times New Roman", serif;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .status {
      font-size: 11px;
      color: var(--muted);
      min-height: 18px;
    }

    /* ===================== */
    /* RESPONSIVE             */
    /* ===================== */
    @media (max-width: 500px) {
      .editor-grid { grid-template-columns: 1fr; }
      .editor-full { grid-column: auto; }
      .recipe-content h2 { font-size: 30px; }
      .step-list li { font-size: 16px; padding: 10px 12px; }
      .ingredient-list { font-size: 16px; }
      .menu-controls .row { grid-template-columns: 1fr; }
      .bottom-nav { height: calc(60px + var(--safe-bottom)); }
      .nav-item .icon { font-size: 20px; }
      .nav-item { font-size: 9px; padding: 4px 0; }
      :root { --nav-height: 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    /* Ocultar scrollbar en general */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  </style>
</head>

<body>

<!-- SPLASH SCREEN         -->

<!-- ===================== -->
<!-- CONTENIDO PRINCIPAL   -->

<div class="wrap" id="appWrap">

  <header>

  <!-- CATEGORIES SCROLL -->

    <button class="quick-btn gold" id="ingredients"><span class="icon">🥬</span>Què tinc?</button>
    <button class="quick-btn" id="favorites"><span class="icon">⭐</span>Favorits</button>

  <!-- MENU VIEW -->
  <div class="view" id="menuView" style="display:none">
    <div class="menu-hero">

        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="tool gold" id="generateMenu" style="flex:2;padding:12px;border-radius:10px;font-weight:800;">✨ Generar</button>
          <button class="tool" id="saveMenu" style="flex:1;padding:12px;border-radius:10px;font-weight:800;">💾 Guardar</button>

        <button class="tool" id="downloadMenu">📥 Descarregar</button>

    <div id="menuGrid" class="menu-grid"></div>
  </div>

</div>

<!-- ===================== -->
<!-- BOTÓ FLOTANT AFEGIR   -->

<!-- ===================== -->
<!-- BOTÓ MODO CUINA       -->
<!-- ===================== -->

<!-- ===================== -->
<!-- NAVEGACIÓ INFERIOR    -->
<!-- ===================== -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-view="recipes">
    <span class="icon">🏠</span>
    Receptes
  </button>
  <button class="nav-item" data-view="menu">
    <span class="icon">📅</span>
    Menú
  </button>

    <span class="icon">🔍</span>
    Cercar
  </button>
  <button class="nav-item" id="navFavorites">
    <span class="icon">⭐</span>
    Favorits
    <span class="badge" id="favCount" style="display:none;">0</span>

<!-- ===================== -->
<!-- MODALS                -->
<!-- ===================== -->
<div class="modal search-modal" id="searchModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>🔍 Cercar</h2>
      <button class="close" id="closeSearch">✕</button>

</div>

  <div class="modal-box">

        <div class="field">

        <div class="field"><label>Menú</label><select id="fMenu"><option>Sí</option><option>No</option></select></div>
        <div class="field"><label>Tipus</label><select id="fTipus"><option>Carn</option><option>Peix</option><option>Llegum</option><option>Pasta</option><option>Arròs</option><option>Ou</option><option>Verdura</option><option>Altres</option></select></div>
        <div class="field"><label>Estat</label><select id="fEstat"><option value="publicada">Publicada</option><option value="esborrany">Esborrany</option></select></div>

    <input id="ingredientInput" placeholder="pollastre, ceba, arròs..." style="width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font-size:16px;">
    <div id="ingredientMatches" style="margin-top:12px;"></div>
  </div>
</div>

<div class="modal" id="menuSelectorModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="selectorTitle">Substituir</h2>
      <button class="close" id="closeMenuSelector">✕</button>
    </div>
    <p class="hint" id="selectorHint" style="font-size:13px;color:var(--muted);margin:0 0 10px;"></p>
    <div id="selectorResults"></div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURACIÓ
  // ============================================================

  // 🔧 CANVIA AQUÍ LA TEVA URL DE GOOGLE APPS SCRIPT
  const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwmuPVkvpobhNhHZIzOVn_UL15RF38GdnroL74JE_CnJXxT1N6A6DSNMnxYV6uZr8G5/exec';

  let recipes = [];
  let categories = [];
  let currentCategory = null;
  let currentSearch = "";
  let favoritesOnly = false;
  let weeklyMenu = [];
  let replacedSlots = new Set();
  let currentWeekKey = getWeekKey(new Date());

  const FAVORITES_KEY = "receptes_jan_favorites_v1";
  const THEME_KEY = "receptes_jan_theme_v1";
  const MENU_DAYS = ["Dilluns","Dimarts","Dimecres","Dijous","Divendres","Dissabte","Diumenge"];

  let favorites = loadFavorites();

  // ============================================================
  // FUNCIONS BÀSIQUES
  // ============================================================

  function loadFavorites() {
    try { return new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]")); }
    catch { return new Set(); }
  }

  function saveFavorites() {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
    updateFavCount();
  }

  function updateFavCount() {
    const badge = document.getElementById("favCount");
    const count = favorites.size;
    if (count > 0) {
      badge.textContent = count;
      badge.style.display = "block";
    } else {
      badge.style.display = "none";
    }
  }

  function norm(text) {
    return String(text || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();
  }

  function escapeHtml(text) {
    return String(text ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getWeekKey(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    const day = d.getDay() || 7;
    d.setDate(d.getDate() + 4 - day);
    const yearStart = new Date(d.getFullYear(), 0, 1);
    const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `${d.getFullYear()}-W${String(week).padStart(2, "0")}`;
  }

  function mealAllowed(recipe, meal) {
    const value = String(recipe.Àpat || "Tots dos");
    return value === "Tots dos" || value === meal;
  }

  // ============================================================
  // TEMA (MODE FOSC)
  // ============================================================

  function getTheme() {
    return localStorage.getItem(THEME_KEY) || "light";
  }

  function updateThemeColor(theme) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#161c13' : '#f0ede0');
}

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : null);
  localStorage.setItem(THEME_KEY, theme);
  updateThemeColor(theme);
  document.getElementById("themeToggle").textContent = theme === "dark" ? "☀️" : "🌙";
}

  document.getElementById("themeToggle").onclick = function() {
    const current = getTheme();
    setTheme(current === "dark" ? "light" : "dark");
  };

  setTheme(getTheme());

  // ============================================================
  // NAVEGACIÓ INFERIOR
  // ============================================================

  function switchView(view) {
    const views = ["recipes", "menu"];
    views.forEach(v => {
      const el = document.getElementById(v === "recipes" ? "recipesView" : "menuView");
      if (el) el.style.display = v === view ? "block" : "none";
    });

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === view);
    });

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.querySelectorAll(".nav-item[data-view]").forEach(btn => {
    btn.onclick = () => switchView(btn.dataset.view);
  });

  // ============================================================
  // CERCA
  // ============================================================

  document.getElementById("navSearch").onclick = function() {
    const modal = document.getElementById("searchModal");
    modal.classList.add("show");
    document.getElementById("searchInput").value = currentSearch || "";
    document.getElementById("searchInput").focus();
    renderSearchResults();
  };

  document.getElementById("closeSearch").onclick = function() {
    document.getElementById("searchModal").classList.remove("show");
  };

  document.getElementById("searchInput").addEventListener("input", renderSearchResults);

  function renderSearchResults() {
    const query = document.getElementById("searchInput").value;
    const box = document.getElementById("searchResults");

    if (!query.trim()) {
      box.innerHTML = `<div class="empty"><strong>Cerca qualsevol cosa</strong>Nom, ingredient o base</div>`;
      return;
    }

    const q = norm(query);
    const words = q.split(/\s+/).filter(Boolean);

    const results = recipes.filter(r => {
      const text = norm([
        r.Nom, r.Categoria, ...(r.Base || []), ...(r.Tags || []), r.Ingredients
      ].join(" "));
      return words.every(w => text.includes(w));
    }).slice(0, 20);

    if (!results.length) {
      box.innerHTML = `<div class="empty"><strong>No hi ha coincidències</strong>Prova una altra cerca</div>`;
      return;
    }

    box.innerHTML = results.map(r => `
      <button class="card" style="width:100%;text-align:left;"
        onclick="closeSearchAndOpen('${escapeHtml(r.Nom)}')">
        <div class="card-head">
          <div class="card-main">
            <div class="category">${escapeHtml(r.Categoria)}</div>
            <div class="title">${escapeHtml(r.Nom)}</div>
          </div>
          <span class="chev">›</span>
        </div>
      </button>
    `).join("");
  }

  function closeSearchAndOpen(name) {
    document.getElementById("searchModal").classList.remove("show");
    const recipe = recipes.find(r => r.Nom === name);
    if (recipe) openRecipeDetail(recipe);
  }

  // ============================================================
  // FAVORITS DES DE LA NAV
  // ============================================================

  document.getElementById("navFavorites").onclick = function() {
    switchView("recipes");
    favoritesOnly = true;
    currentCategory = null;
    currentSearch = "";
    renderResults();
    updateCategoryChips();
  };

  // ============================================================
  // CARREGAR DADES
  // ============================================================

  function loadData() {
    // Carregar receptes via JSONP
    loadDataViaScript();
    // Carregar categories via JSONP
    loadCategories();
  }

  function loadDataViaScript() {
    const script = document.createElement('script');
    const callbackName = 'jsonp_callback_' + Date.now();

    window[callbackName] = function(data) {
  try {
    recipes = Array.isArray(data) ? data : [];
    renderCategories();
    renderResults();
    loadWeeklyMenu();
    updateFavCount();
  } catch (e) {
    console.error(e);
  } finally {
    hideSplash();
    delete window[callbackName];
  }
};

    script.src = APP_SCRIPT_URL + '?action=getRecipes&callback=' + callbackName;
    script.onerror = function() {
      document.getElementById("results").innerHTML =
        `<div class="empty"><strong>Error carregant receptes</strong>
        No s'ha pogut connectar amb l'API.</div>`;
      hideSplash();
    };
    document.head.appendChild(script);

    setTimeout(() => {
      if (recipes.length === 0) {
        document.getElementById("results").innerHTML =
          `<div class="empty"><strong>Error carregant receptes</strong>
          La connexió ha trigat massa.</div>`;
        hideSplash();
      }
    }, 8000);
  }

  function loadCategories() {
    const callbackName = 'jsonp_categories_' + Date.now();

    window[callbackName] = function(data) {
      categories = Array.isArray(data) ? data : [];

      const select = document.getElementById("fCategory");
      if (select) {
        select.innerHTML = `<option value="">Selecciona...</option>`;
        categories.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      }

      renderCategories();
      delete window[callbackName];
    };

    const script = document.createElement('script');
    script.src = APP_SCRIPT_URL + '?action=getCategories&callback=' + callbackName;
    script.onerror = function() {
      // Si falla, intentem extreure categories de les receptes
      loadCategoriesFromRecipes();
    };
    document.head.appendChild(script);

    setTimeout(() => {
      if (categories.length === 0) {
        loadCategoriesFromRecipes();
      }
    }, 5000);
  }

  function loadCategoriesFromRecipes() {
    if (recipes.length > 0) {
      const cats = new Set();
      recipes.forEach(r => {
        if (r.Categoria) cats.add(r.Categoria);
      });
      categories = Array.from(cats).sort();

      const select = document.getElementById("fCategory");
      if (select) {
        select.innerHTML = `<option value="">Selecciona...</option>`;
        categories.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      }

      renderCategories();
    }
  }

  // ============================================================
  // SPLASH SCREEN
  // ============================================================

  function hideSplash() {
    const splash = document.getElementById('splashScreen');
    if (splash) {
      splash.classList.add('hidden');
      setTimeout(() => {
        splash.remove();
      }, 800);
    }
  }

  // ============================================================
  // CATEGORIES
  // ============================================================

  function renderCategories() {
    const box = document.getElementById("categoriesScroll");
    if (!box) return;

    box.innerHTML = `<button class="category-chip active" data-cat="all">📋 Totes</button>`;

    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "category-chip";
      btn.dataset.cat = cat;
      btn.textContent = cat;
      btn.onclick = function() {
        currentCategory = this.dataset.cat === "all" ? null : this.dataset.cat;
        favoritesOnly = false;
        currentSearch = "";
        renderResults();
        updateCategoryChips();
      };
      box.appendChild(btn);
    });
  }

  function updateCategoryChips() {
    document.querySelectorAll(".category-chip").forEach(btn => {
      const isActive = (btn.dataset.cat === "all" && !currentCategory) ||
        (btn.dataset.cat === currentCategory);
      btn.classList.toggle("active", isActive);
    });
  }

  // ============================================================
  // RENDER RESULTS
  // ============================================================

  function filteredRecipes() {
    let list = [...recipes];

    if (currentCategory) {
      list = list.filter(r => r.Categoria === currentCategory);
    }
    if (favoritesOnly) {
      list = list.filter(r => favorites.has(r.Nom));
    }
    if (currentSearch) {
      const q = norm(currentSearch);
      const words = q.split(/\s+/).filter(Boolean);
      list = list.filter(r => {
        const text = norm([r.Nom, r.Categoria, ...(r.Base || []), ...(r.Tags || []), r.Ingredients].join(" "));
        return words.every(w => text.includes(w));
      });
    }

    return list.sort((a, b) => a.Nom.localeCompare(b.Nom, "ca"));
  }

  function renderResults() {
    const box = document.getElementById("results");
    const list = filteredRecipes();

    if (!list.length) {
      box.innerHTML = `<div class="empty">
        <strong>${favoritesOnly ? "No tens favorits" : "No hi ha receptes"}</strong>
        ${favoritesOnly ? "Obre una recepta i prem ☆ per afegir-la" : "Prova una altra categoria o cerca"}
      </div>`;
      return;
    }

    box.innerHTML = list.map(r => {
      const isFav = favorites.has(r.Nom);
      const base = Array.isArray(r.Base) ? r.Base.slice(0, 2).join(" · ") : "";
      return `
        <div class="card">
          <button class="card-head" onclick="openRecipeDetail(recipes.find(r=>r.Nom==='${escapeHtml(r.Nom)}'))">
            <div class="card-main">
              <div class="category">${escapeHtml(r.Categoria)}</div>
              <div class="title">${escapeHtml(r.Nom)}</div>
              <div class="meta">
                ${base ? `<span class="tag">${escapeHtml(base)}</span>` : ""}
                ${isFav ? `<span class="tag">⭐</span>` : ""}
                ${r.Tipus ? `<span class="tag">${escapeHtml(r.Tipus)}</span>` : ""}
              </div>
            </div>

// ============================================================
// GUARDAR RECEPTA — connexió real amb el Sheet (v2)
// Reemplaça la funció saveRecipe i afegeix reloadRecipesAfterSave.
// No cal tocar el backend: el doPost de l'Apps Script ja crida
// handleRequest, i un POST form-encoded omple e.parameter tot sol.
// ============================================================

function saveRecipe() {
  const recipe = collectEditorRecipe();
  const msg = document.getElementById("saveMessage");

  if (!recipe.Nom || !recipe.Categoria) {
    msg.textContent = "⚠️ Nom i categoria obligatoris.";
    return;
  }

  msg.textContent = "Guardant...";

  const action = editingRecipeId ? "updateRecipe" : "addRecipe";

  // POST form-encoded: és una "simple request" (no dispara preflight CORS)
  // i omple e.parameter al doPost, que handleRequest ja sap llegir.
  const body = new URLSearchParams({
    action: action,
    data: JSON.stringify(recipe)
  });

  fetch(APP_SCRIPT_URL, { method: "POST", body: body })
    .then(r => r.json())
    .then(res => {
      if (res && res.error) {
        msg.textContent = "❌ " + res.error;
        return;
      }
      msg.textContent = "✅ Guardat!";
      reloadRecipesAfterSave(recipe.Nom);
    })
    .catch(() => {
      // Si el navegador bloqueja la lectura de la resposta (CORS), el POST
      // igualment ha arribat al servidor: rellegim del Sheet per confirmar.
      msg.textContent = "✅ Enviat, refrescant...";
      reloadRecipesAfterSave(recipe.Nom);
    });
}

// Rellegeix les receptes del Sheet (JSONP), refresca la UI i reobre el
// detall de la recepta guardada per confirmar que hi és.
function reloadRecipesAfterSave(savedName) {
  const callbackName = "jsonp_reload_" + Date.now();

  window[callbackName] = function(data) {
    if (Array.isArray(data)) recipes = data;
    renderCategories();
    renderResults();
    updateFavCount();
    closeEditor();
    if (savedName) {
      const saved = recipes.find(r => r.Nom === savedName);
      if (saved) openRecipeDetail(saved);
    }
    delete window[callbackName];
  };

  const script = document.createElement("script");
  script.src = APP_SCRIPT_URL + "?action=getRecipes&callback=" + callbackName;
  script.onerror = function() {
    closeEditor();
    delete window[callbackName];
  };
  document.head.appendChild(script);
}
 // ============================================================
// MENÚ SETMANAL — generador equilibrat (v2)
// Reemplaça menuCandidates, chooseRecipe i generateWeeklyMenu
// ============================================================

// Un slot és "entre setmana" si cau de dilluns a divendres (índex 0..4).
// Així, en mode "Setmana completa" els plats elaborats només poden anar
// a dissabte/diumenge, i els dies feiners reben plats aptes entre setmana.
function isWeekdaySlot(dayIndex) {
  return dayIndex < 5;
}

// Bases normalitzades d'una recepta (proteïna o ingredient principal).
function baseList(r) {
  return Array.isArray(r.Base) ? r.Base.map(norm).filter(Boolean) : [];
}

function menuCandidates(meal, options, dayIndex) {
  const weekdaySuitable = isWeekdaySlot(dayIndex);
  return recipes.filter(r => {
    if (norm(r.Menu) !== "si") return false;
    if (!mealAllowed(r, meal)) return false;
    if (options.tupper === "yes" && norm(r.Tupper) !== "si") return false;
    // Dl..Dv: només plats marcats aptes entre setmana. Cap de setmana: lliure.
    if (weekdaySuitable && norm(r.EntreSetmana) !== "si") return false;
    return true;
  });
}

// ctx porta l'estat d'equilibri de tota la setmana i del dia en curs.
function chooseRecipe(candidates, ctx, options) {
  const available = candidates.filter(r => !ctx.usedNames.has(r.Nom));
  if (!available.length) return null;

  const scored = available.map(r => {
    let score = Math.random() * 8;            // una mica d'atzar per no repetir setmanes
    const tipus = r.Tipus || "Altres";
    const bases = baseList(r);

    // No repetir el mateix Tipus dins d'un mateix dia (dinar i sopar).
    if (ctx.typesToday.has(tipus)) score -= 100;

    // Repartir els Tipus al llarg de la setmana (evita 5 llegums).
    score -= 30 * (ctx.typeWeek.get(tipus) || 0);

    // Repartir les bases a la setmana (evita pollastre cada dia).
    bases.forEach(b => { score -= 12 * (ctx.baseWeek.get(b) || 0); });

    // Penalitzar repetir base d'ahir (dos dies seguits amb la mateixa proteïna).
    if (bases.some(b => ctx.basesYesterday.has(b))) score -= 20;

    // No repetir base el mateix dia.
    if (bases.some(b => ctx.basesToday.has(b))) score -= 25;

    // Preferència de tupper.
    if (options.tupper === "prefer" && norm(r.Tupper) === "si") score += 15;

    return { recipe: r, score };
  }).sort((a, b) => b.score - a.score);

  return scored[0]?.recipe || null;
}

function generateWeeklyMenu() {
  const period = document.getElementById("menuPeriod").value;
  const mealsMode = document.getElementById("menuMeals").value;
  const tupper = document.getElementById("menuTupper").value;

  const options = { tupper };
  const days = period === "weekday" ? MENU_DAYS.slice(0, 5) : MENU_DAYS.slice();
  const meals = mealsMode === "both"
    ? ["Dinar", "Sopar"]
    : [mealsMode === "lunch" ? "Dinar" : "Sopar"];

  const ctx = {
    usedNames: new Set(),      // noms ja usats aquesta setmana
    typeWeek: new Map(),       // recompte de Tipus a la setmana
    baseWeek: new Map(),       // recompte de bases a la setmana
    basesYesterday: new Set(), // bases del dia anterior
    typesToday: new Set(),     // Tipus del dia en curs
    basesToday: new Set()      // bases del dia en curs
  };

  weeklyMenu = [];
  replacedSlots = new Set();

  days.forEach((day, dayIndex) => {
    ctx.typesToday = new Set();
    ctx.basesToday = new Set();

    meals.forEach(meal => {
      let candidates = menuCandidates(meal, options, dayIndex);

      // Fallback 1: si un dia feiner no té prou plats aptes entre setmana,
      // relaxem la restricció i deixem qualsevol plat de menú.
      if (!candidates.length) {
        candidates = recipes.filter(r =>
          norm(r.Menu) === "si" &&
          mealAllowed(r, meal) &&
          (tupper !== "yes" || norm(r.Tupper) === "si")
        );
      }

      let chosen = chooseRecipe(candidates, ctx, options);

      // Fallback 2: si tot està repetit, permetem repetir nom com a últim recurs.
      if (!chosen && candidates.length) {
        const relaxed = { ...ctx, usedNames: new Set() };
        chosen = chooseRecipe(candidates, relaxed, options);
      }

      weeklyMenu.push({ day, meal, recipeName: chosen ? chosen.Nom : "" });

      if (chosen) {
        const tipus = chosen.Tipus || "Altres";
        ctx.usedNames.add(chosen.Nom);
        ctx.typesToday.add(tipus);
        ctx.typeWeek.set(tipus, (ctx.typeWeek.get(tipus) || 0) + 1);
        baseList(chosen).forEach(b => {
          ctx.basesToday.add(b);
          ctx.baseWeek.set(b, (ctx.baseWeek.get(b) || 0) + 1);
        });
      }
    });

    // El que s'ha cuinat avui passa a ser "ahir" per al dia següent.
    ctx.basesYesterday = new Set(ctx.basesToday);
  });

  renderWeeklyMenu();
  const empty = weeklyMenu.filter(s => !s.recipeName).length;
  document.getElementById("menuStatus").textContent = empty
    ? `⚠️ Falten ${empty} àpat${empty === 1 ? "" : "s"} per manca de receptes aptes.`
    : "✅ Menú generat i equilibrat!";
}

  function renderWeeklyMenu() {
    const grid = document.getElementById("menuGrid");
    const mealsToShow = document.getElementById("menuMeals").value === "both"
      ? ["Dinar", "Sopar"]
      : [document.getElementById("menuMeals").value === "lunch" ? "Dinar" : "Sopar"];

    const period = document.getElementById("menuPeriod").value;
    const days = period === "week" ? MENU_DAYS : MENU_DAYS.slice(0, 5);

    grid.innerHTML = days.map(day => {
      const slots = mealsToShow.map(meal => {
        const slot = weeklyMenu.find(s => s.day === day && s.meal === meal);
        const recipe = slot?.recipeName ? recipes.find(r => r.Nom === slot.recipeName) : null;
        const isReplaced = replacedSlots.has(`${day}|${meal}`);

        return `<div class="menu-slot">
          <small>${meal}</small>
          ${recipe ? `
            <button onclick="openMenuSelector('${day}','${meal}','${escapeHtml(recipe.Nom)}')">
              <strong>${escapeHtml(recipe.Nom)}</strong>
              <div class="hint">${escapeHtml(recipe.Categoria)} · ${escapeHtml(recipe.Tipus || "Altres")}
                ${isReplaced ? '<span class="replaced"> 🔁 substituït</span>' : ''}
              </div>
            </button>
          ` : `
            <button onclick="openMenuSelector('${day}','${meal}','')" style="color:var(--muted);">
              <strong>➕ Seleccionar</strong>
            </button>
          `}
        </div>`;
      }).join("");

      return `<div class="menu-day"><h3>${day}</h3>${slots}</div>`;
    }).join("");
  }

  function loadWeeklyMenu() {
  const label = document.getElementById("menuWeekLabel");
  if (label) label.textContent = currentWeekKey;
  try {
    const saved = localStorage.getItem('weeklyMenu_' + currentWeekKey);
    if (saved) {
      weeklyMenu = JSON.parse(saved);
      renderWeeklyMenu();
    }
  } catch (e) {
    console.error(e);
  }
}

  function saveWeeklyMenuToSheet() {
    const status = document.getElementById("menuStatus");
    const slots = weeklyMenu.filter(s => s.recipeName);
    if (!slots.length) {
      status.textContent = "⚠️ No hi ha menú per guardar.";

    try {
      localStorage.setItem('weeklyMenu_' + currentWeekKey, JSON.stringify(weeklyMenu));
      status.textContent = "✅ Guardat localment!";
    } catch (e) {
      status.textContent = "❌ " + e.message;
    }
  }

  // ============================================================
  // SUBSTITUIR PLAT DEL MENÚ
  // ============================================================

  function openMenuSelector(day, meal, currentRecipeName) {
    const modal = document.getElementById("menuSelectorModal");
    document.getElementById("selectorTitle").textContent = `Substituir ${meal} de ${day}`;
    document.getElementById("selectorHint").textContent = currentRecipeName
      ? `Selecciona una recepta per substituir "${currentRecipeName}":`
      : `Selecciona una recepta per a ${meal}:`;

    const candidates = recipes.filter(r => {
      const apat = r.Àpat || "Tots dos";
      return (apat === "Tots dos" || apat === meal) &&
        norm(r.Menu) === "si" &&
        r.Nom !== currentRecipeName;
    });

    const box = document.getElementById("selectorResults");

    if (!candidates.length) {
      box.innerHTML = `<div class="empty"><strong>No hi ha alternatives</strong>Cap recepta marcada com a "Menú" per a ${meal}.</div>`;
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
      return;
    }

    const grouped = {};
    candidates.forEach(r => {
      const cat = r.Categoria || "Sense categoria";
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(r);
    });

    let html = "";
    Object.keys(grouped).sort().forEach(cat => {
      html += `<div style="margin-top:10px;"><strong style="color:var(--olive);font-size:12px;text-transform:uppercase;">${escapeHtml(cat)}</strong>`;
      grouped[cat].forEach(r => {
        html += `
          <button class="card" style="width:100%;text-align:left;margin-top:5px;"
            onclick="replaceMenuSlot('${day}','${meal}','${escapeHtml(r.Nom).replace(/'/g, "\\'")}')">
            <div class="card-head">
              <div class="card-main">
                <div class="title" style="font-size:17px;">${escapeHtml(r.Nom)}</div>
                <div class="meta">${escapeHtml(r.Tipus || "Altres")} ${r.Tupper === "Sí" ? "· 🍱" : ""}</div>
              </div>
            </div>
          </button>
        `;
      });
      html += "</div>";
    });

    box.innerHTML = html;
    modal.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeMenuSelector() {
    document.getElementById("menuSelectorModal").classList.remove("show");
    document.body.style.overflow = "";
  }

  function replaceMenuSlot(day, meal, newRecipeName) {
    closeMenuSelector();

    const slot = weeklyMenu.find(s => s.day === day && s.meal === meal);
    if (!slot) {
      document.getElementById("menuStatus").textContent = "❌ No s'ha trobat l'àpat.";
      return;
    }

    slot.recipeName = newRecipeName;
    replacedSlots.add(`${day}|${meal}`);
    renderWeeklyMenu();
    document.getElementById("menuStatus").textContent = `✅ Substituït per "${newRecipeName}". Recorda guardar!`;
  }

  // ============================================================
  // COPIAR / DESCARREGAR MENÚ
  // ============================================================

  function getMenuText() {
    const lines = [`MENÚ SETMANAL (${currentWeekKey})`, "━".repeat(30), ""];
    const days = document.getElementById("menuPeriod").value === "week" ? MENU_DAYS : MENU_DAYS.slice(0, 5);
    const meals = document.getElementById("menuMeals").value === "both"
      ? ["Dinar", "Sopar"]
      : [document.getElementById("menuMeals").value === "lunch" ? "Dinar" : "Sopar"];

    days.forEach(day => {
      lines.push(`📅 ${day}`);
      meals.forEach(meal => {
        const slot = weeklyMenu.find(s => s.day === day && s.meal === meal);
        const name = slot?.recipeName || "— Sense assignar";
        const replaced = replacedSlots.has(`${day}|${meal}`) ? " 🔁" : "";
        lines.push(`  ${meal}: ${name}${replaced}`);
      });
      lines.push("");
    });

    return lines.join("\n");
  }

  function copyMenuToClipboard() {
    const text = getMenuText();
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => document.getElementById("menuStatus").textContent = "✅ Copiat!")
        .catch(() => copyMenuFallback(text));
    } else {
      copyMenuFallback(text);
    }
  }

  function copyMenuFallback(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0;left:-9999px";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      document.getElementById("menuStatus").textContent = "✅ Copiat!";
    } catch {
      document.getElementById("menuStatus").textContent = "❌ No s'ha pogut copiar.";
    }
    document.body.removeChild(ta);
  }

  function downloadMenuAsTxt() {
    const blob = new Blob([getMenuText()], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `menu_${currentWeekKey}.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    document.getElementById("menuStatus").textContent = "✅ Descarregat!";
  }

  function openIngredients() {

  function renderIngredientMatches() {
    const raw = document.getElementById("ingredientInput").value;
    const chosen = raw.split(",").map(norm).filter(Boolean);
    const box = document.getElementById("ingredientMatches");

    if (!chosen.length) {
      box.innerHTML = `<div class="empty"><strong>Escriu què tens</strong>pollastre, ceba, arròs...</div>`;
      return;
    }

    const scored = recipes.map(r => {
      const tags = (r.Tags || []).map(norm);
      const matched = chosen.filter(ing => tags.some(t => t.includes(ing) || ing.includes(t)));
      return { recipe: r, score: matched.length };
    }).filter(i => i.score > 0)
      .sort((a, b) => b.score - a.score || a.recipe.Nom.localeCompare(b.recipe.Nom, "ca"))
      .slice(0, 15);

    if (!scored.length) {
      box.innerHTML = `<div class="empty"><strong>No hi ha coincidències</strong>Prova altres ingredients</div>`;
      return;
    }

    box.innerHTML = scored.map(({ recipe }) => `
      <button class="card" style="width:100%;text-align:left;margin-bottom:6px;"
        onclick="closeIngredients();openRecipeDetail(recipes.find(r=>r.Nom==='${escapeHtml(recipe.Nom)}'))">
        <div class="card-head">
          <div class="card-main">
            <div class="title" style="font-size:17px;">${escapeHtml(recipe.Nom)}</div>
            <div class="meta">${escapeHtml(recipe.Categoria)}</div>
          </div>
        </div>
      </button>
    `).join("");
  }

  document.getElementById("showAll").onclick = function() {
    currentCategory = null;
    favoritesOnly = false;
    currentSearch = "";
    renderResults();
    updateCategoryChips();
  };

  document.getElementById("random").onclick = function() {
    if (!recipes.length) return;
    const pool = currentCategory ? recipes.filter(r => r.Categoria === currentCategory) : recipes;
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    if (!chosen) return;
    currentCategory = chosen.Categoria;
    favoritesOnly = false;
    currentSearch = "";
    renderResults();
    updateCategoryChips();
    openRecipeDetail(chosen);
  };

  document.getElementById("favorites").onclick = function() {
    favoritesOnly = !favoritesOnly;
    if (favoritesOnly) {
      currentCategory = null;
      currentSearch = "";
    }
    renderResults();
    updateCategoryChips();
  };

  document.getElementById("ingredients").onclick = openIngredients;
  document.getElementById("closeIngredients").onclick = closeIngredients;

  document.getElementById("fabAdd").onclick = openAdd;
  document.getElementById("closeEditor").onclick = closeEditor;
  document.getElementById("cancelEditor").onclick = closeEditor;
  document.getElementById("saveRecipe").onclick = saveRecipe;

  document.getElementById("generateMenu").onclick = generateWeeklyMenu;
  document.getElementById("saveMenu").onclick = saveWeeklyMenuToSheet;
  document.getElementById("copyMenu").onclick = copyMenuToClipboard;
  document.getElementById("downloadMenu").onclick = downloadMenuAsTxt;
  document.getElementById("closeMenuSelector").onclick = closeMenuSelector;

  document.getElementById("menuPeriod").addEventListener("change", renderWeeklyMenu);
  document.getElementById("menuMeals").addEventListener("change", renderWeeklyMenu);

  document.getElementById("ingredientInput").addEventListener("input", renderIngredientMatches);

  document.querySelectorAll(".modal").forEach(modal => {
    modal.addEventListener("click", function(e) {
      if (e.target === this) {
        this.classList.remove("show");
        document.body.style.overflow = "";
        document.getElementById("cookModeBtn").style.display = "none";
      }
    });
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      document.querySelectorAll(".modal.show").forEach(m => {
        m.classList.remove("show");
        document.body.style.overflow = "";
        document.getElementById("cookModeBtn").style.display = "none";
      });
    }
  });

  // ============================================================
  // BOTÓ PER TORNAR A DALT
  // ============================================================

  const backToTop = document.getElementById('backToTop');

  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      backToTop.classList.add('visible');
    } else {
      backToTop.classList.remove('visible');
    }
  });

  backToTop.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ============================================================
  // REORGANITZACIÓ DEL DOM
  // ============================================================

  const wrap = document.getElementById("appWrap");
  const menuView = document.getElementById("menuView");

  const recipesView = document.createElement("div");
  recipesView.id = "recipesView";
  recipesView.className = "view active";

  const children = Array.from(wrap.children);
  children.forEach(child => {
    if (child.id !== "menuView") {
      recipesView.appendChild(child);
    }
  });

  wrap.innerHTML = "";
  wrap.appendChild(recipesView);
  wrap.appendChild(menuView);

  // ============================================================
  // INICI
  // ============================================================

  loadData();
  updateFavCount();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.error);
}
  
  console.log("🍳 Receptes Jan — Versió App!");
</script>
</body>
</html>
